<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Moved to /workbench</title>
    <!--
      The address handed out while the preview shell existed, and the one RELEASE.md
      still points at as the old link. The app now lives under /app/, so this keeps
      every link that was already given to somebody working rather than silently
      404ing.

      Both a meta refresh and a script: the script is instant and carries the query
      string, which is the whole point of the preview URL, and the refresh is what
      happens if scripting is off.
    -->
    <meta http-equiv="refresh" content="0; url=./workbench" />
    <script>
      location.replace('./workbench' + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>The device preview has moved to <a href="./workbench">/workbench</a>.</p>
  </body>
</html>
