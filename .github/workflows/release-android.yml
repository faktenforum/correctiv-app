# Builds a signed Android APK for BOTH apps and attaches them to a GitHub Release.
#
# Trigger: push a version tag, e.g.
#     git tag v1.2.3 && git push origin v1.2.3
# The release (with auto-generated notes) is created automatically and the
# artifacts are attached as downloadable assets.
#
# Manual runs (workflow_dispatch) build the artifacts and upload them to the run
# only — no release is created. That is how to test this pipeline.
#
# Two APKs, because both apps are maintained while one replaces the other
# (adr/0006-one-core-two-hosts.md). They share the package id
# org.correctiv.app.prototype, so only ONE can be installed on a device at a time —
# the asset names say which is which.
#
# Signing:
#   - If the ANDROID_KEYSTORE_* secrets are set (see RELEASE.md), both APKs are
#     signed with the real upload key, and the NativeScript app additionally
#     produces a Play-ready AAB.
#   - If they are NOT set, both fall back to the committed throwaway TEST keystore
#     (apps/mobile/signing/correctiv-test.keystore) — installable test builds only.
#     Never use the test key for the Play Store.
# Optional secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key (alias) password
name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create the release and upload assets

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nativescript:
    name: NativeScript APK
    runs-on: ubuntu-latest
    outputs:
      real: ${{ steps.ks.outputs.real }}
    # Skip the NativeScript doctor preflight (no emulator on a build runner);
    # the actual compilation toolchain is validated by the build itself.
    env:
      NS_SKIP_ENV_CHECK: "true"
      # @nativescript/vite 2.0.3 only deploys the Vite bundle into the native
      # project in watch mode (ns debug, via an IPC channel). A one-shot
      # `ns build` has no IPC, so the bundle never reaches assets/app and the
      # Static Binding Generator fails. Point Vite's output dir straight at the
      # platform assets dir so the bundle lands where the build expects it.
      NS_VITE_DIST_DIR: ${{ github.workspace }}/apps/mobile/platforms/android/app/src/main/assets/app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" >/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Install NativeScript CLI
        run: npm install -g nativescript

      # Pick the signing key: real upload keystore from secrets (Play-ready) or
      # the committed throwaway TEST keystore (installable test APK only).
      - name: Prepare keystore
        id: ks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Signing with the real upload keystore (from secrets)."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            echo "path=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_OUTPUT"
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets set — signing with the committed TEST keystore. The result is NOT for the Play Store."
            echo "path=${GITHUB_WORKSPACE}/apps/mobile/signing/correctiv-test.keystore" >> "$GITHUB_OUTPUT"
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi

      # On a tag, drive the app version from the tag (vX.Y.Z -> X.Y.Z) and use
      # the run number as a monotonic versionCode (Play Store requires it to
      # increase on every upload). Skipped on manual runs.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" apps/mobile/App_Resources/Android/app.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" apps/mobile/App_Resources/Android/app.gradle

      # Passwords/alias fall back to the TEST keystore's known values when the
      # secrets are absent (GitHub returns '' for an unset secret).
      - name: Build signed APK
        working-directory: apps/mobile
        env:
          KS_PATH: ${{ steps.ks.outputs.path }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'correctiv-test' }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'correctiv-test' }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'correctiv-test' }}
        run: |
          ns build android --release \
            --key-store-path "$KS_PATH" \
            --key-store-password "$KS_PASSWORD" \
            --key-store-alias "$KS_ALIAS" \
            --key-store-alias-password "$KS_KEY_PASSWORD"

      # The AAB is only useful for the Play Store, so build it for real releases
      # only (skipped on the TEST-keystore fallback).
      - name: Build signed AAB (Play Store)
        if: steps.ks.outputs.real == 'true'
        working-directory: apps/mobile
        env:
          KS_PATH: ${{ steps.ks.outputs.path }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ns build android --release --aab \
            --key-store-path "$KS_PATH" \
            --key-store-password "$KS_PASSWORD" \
            --key-store-alias "$KS_ALIAS" \
            --key-store-alias-password "$KS_KEY_PASSWORD"

      - name: SBG diagnostics on failure
        if: failure()
        working-directory: apps/mobile
        run: |
          echo "=== which node / version ==="; which node; node --version
          echo "=== runSbg.log ==="
          cat platforms/android/build-tools/runSbg.log 2>/dev/null || echo "(no runSbg.log found)"
          echo "=== js_parser verbose (enableErrorLogging) ==="
          node platforms/android/build-tools/jsparser/js_parser.js enableErrorLogging 2>&1 | tail -60 || true

      - name: Collect artifacts
        run: |
          mkdir -p dist
          NAME="correctiv-app-nativescript-${GITHUB_REF_NAME}"
          cp apps/mobile/platforms/android/app/build/outputs/apk/release/*.apk "dist/${NAME}.apk"
          # AAB only exists for real releases; ignore if absent (TEST fallback).
          cp apps/mobile/platforms/android/app/build/outputs/bundle/release/*.aab "dist/${NAME}.aab" 2>/dev/null || true
          ls -lh dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-nativescript
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  expo:
    name: Expo APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" >/dev/null || true

      - name: Install dependencies
        run: npm ci

      # Drive version and versionCode from the tag, before prebuild writes them
      # into build.gradle. Same monotonic versionCode rule as the other job.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "apps/mobile-rn/app.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.expo.version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            j.expo.android = { ...j.expo.android, versionCode: Number(process.env.GITHUB_RUN_NUMBER) };
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            console.log(`versionName=${j.expo.version} versionCode=${j.expo.android.versionCode}`);
          '

      # android/ is gitignored: it is generated from app.json. --no-install because
      # npm ci already ran at the ROOT.
      - name: Prebuild the native project
        working-directory: apps/mobile-rn
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile-rn/android
        run: ./gradlew assembleRelease

      # Gradle signs the release variant with the template's debug key. Re-sign it
      # with the same key the NativeScript job used, so a release cannot ship two
      # APKs under two different identities. apksigner replaces the signature; the
      # APK is already zipaligned by Gradle.
      - name: Sign with the release key
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'correctiv-test' }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'correctiv-test' }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'correctiv-test' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"
            KS_PATH="${RUNNER_TEMP}/release.keystore"
          else
            echo "::warning::No ANDROID_KEYSTORE_* secrets set — signing with the committed TEST keystore."
            KS_PATH="${GITHUB_WORKSPACE}/apps/mobile/signing/correctiv-test.keystore"
          fi
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          mkdir -p dist
          NAME="correctiv-app-expo-${GITHUB_REF_NAME}"
          cp apps/mobile-rn/android/app/build/outputs/apk/release/app-release.apk "dist/${NAME}.apk"
          "$APKSIGNER" sign \
            --ks "$KS_PATH" --ks-pass "pass:${KS_PASSWORD}" \
            --ks-key-alias "$KS_ALIAS" --key-pass "pass:${KS_KEY_PASSWORD}" \
            "dist/${NAME}.apk"
          "$APKSIGNER" verify --print-certs "dist/${NAME}.apk"
          ls -lh dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-expo
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to the GitHub Release
    runs-on: ubuntu-latest
    needs: [nativescript, expo]
    # Only tags create a release; a manual run stops after the two builds, with the
    # APKs on the run itself.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download both builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lhR dist

      - name: Attach
        # Pinned to a full commit SHA (supply-chain hardening for this
        # third-party action, which runs with contents: write).
        # Bump deliberately; check https://github.com/softprops/action-gh-release/releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.apk
            dist/*.aab
          # In the TEST-keystore fallback there is no AAB, so don't fail on it.
          fail_on_unmatched_files: false
          generate_release_notes: true
          append_body: true
          body: |
            **Two APKs**, one per app — they share the package id, so only one can be installed at a time:
            `…-expo-…apk` is the app going forward, `…-nativescript-…apk` the one it replaces.
            ${{ needs.nativescript.outputs.real == 'true' && '' || '> ⚠️ **Test build** — signed with the in-repo test key, **not** for the Play Store. For sideloading/testing only.' }}
