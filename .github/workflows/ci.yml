# Quality gate for every PR and every push to main.
#
# Three jobs, cheapest first:
#   check          — typecheck every package, oxlint, oxfmt --check, headless tests
#                    (~1 min incl. install; no Android SDK, no emulator)
#   expo-web       — static web export of apps/mobile-rn, plus assertions that it
#                    is not silently broken (see the job for why that is needed)
#   android-debug  — unsigned debug APK, so native/build breakage surfaces early
#
# The repo is an npm workspace: `npm ci` runs at the root. apps/mobile is the
# NativeScript app (being replaced), apps/mobile-rn the Expo one that supersedes
# it — see adr/0001-monorepo-and-platform-free-core.md.
name: CI

on:
  # Every pull request, not just those targeting main — otherwise a stacked PR
  # (e.g. a spike branched off a feature branch) silently gets no gate at all.
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc + vue-tsc over both packages, then oxlint, oxfmt --check and vitest.
      # Includes the boundary guard that keeps the core free of platform SDKs.
      - name: Check
        run: npm run check

  expo-web:
    name: Expo web export
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web bundle
        working-directory: apps/mobile-rn
        run: npm run build:web

      # The export succeeding is NOT sufficient on its own: a component with no
      # web implementation still exports fine. react-native-webview in
      # particular renders "React Native WebView does not support this platform."
      # So assert the built output does not contain that text, and that the
      # routes we expect were actually emitted.
      - name: Assert the web bundle is not silently broken
        working-directory: apps/mobile-rn
        run: |
          set -euo pipefail
          if grep -rq "does not support this platform" dist/; then
            echo "::error::A component without web support reached the web bundle."
            grep -rl "does not support this platform" dist/ | head
            exit 1
          fi
          for route in index artikel entdecken mediathek mitmachen profil; do
            test -f "dist/$route.html" || { echo "::error::missing dist/$route.html"; exit 1; }
          done
          echo "web export OK — $(find dist -name '*.html' | wc -l) routes, no unsupported-platform stubs"

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: correctiv-app-web
          path: apps/mobile-rn/dist
          if-no-files-found: error
          retention-days: 14

  android-debug:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: check
    # Skip the NativeScript doctor preflight: a build-only runner has no
    # emulator/SDK images, which the doctor otherwise treats as a fatal error
    # even though a compilation-capable SDK is present.
    env:
      NS_SKIP_ENV_CHECK: "true"
      # @nativescript/vite 2.0.3 only deploys the Vite bundle into the native
      # project in watch mode (ns debug, via an IPC channel). A one-shot
      # `ns build` has no IPC, so the bundle never reaches assets/app and the
      # Static Binding Generator fails. Point Vite's output dir straight at the
      # platform assets dir so the bundle lands where the build expects it.
      NS_VITE_DIST_DIR: ${{ github.workspace }}/apps/mobile/platforms/android/app/src/main/assets/app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub-hosted ubuntu runners ship the Android SDK pre-installed; this
      # only makes sure licenses are accepted and SDK 35 is present.
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null || true

      # Workspace root — installs every package, links @correctiv/app-core.
      - name: Install dependencies
        run: npm ci

      - name: Install NativeScript CLI
        run: npm install -g nativescript

      - name: Build Android (debug)
        working-directory: apps/mobile
        run: ns build android

      # Surface the real Static Binding Generator error if the build fails:
      # the top-level log only says "error in the JS Parser execution".
      - name: SBG diagnostics on failure
        if: failure()
        working-directory: apps/mobile
        run: |
          echo "=== which node / version ==="; which node; node --version
          echo "=== runSbg.log ==="
          cat platforms/android/build-tools/runSbg.log 2>/dev/null || echo "(no runSbg.log found)"
          echo "=== js_parser verbose (enableErrorLogging) ==="
          node platforms/android/build-tools/jsparser/js_parser.js enableErrorLogging 2>&1 | tail -60 || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: correctiv-app-debug-apk
          path: apps/mobile/platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
