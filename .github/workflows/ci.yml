# Quality gate for every PR and every push to main.
#
# Four jobs, cheapest first:
#   check                 — typecheck every package, oxlint, oxfmt --check, headless
#                           tests (~1 min incl. install; no Android SDK, no emulator)
#   expo-web              — static web export of apps/mobile-rn, plus assertions that
#                           it is not silently broken (see the job for why). Built for
#                           a domain root; pages.yml rebuilds the same export under
#                           the Pages base path and publishes it.
#   android-expo          — Android APK of the Expo app
#   android-nativescript  — Android APK of the NativeScript app
#
# The repo is an npm workspace: `npm ci` runs at the root. Behaviour lives in
# packages/app-core and is shared by both apps, so `check` covers it once for both;
# apps/mobile-rn is the Expo app going forward, apps/mobile the NativeScript one it
# replaces — see ARCHITECTURE.md and adr/0006-one-core-two-hosts.md.
#
# Both apps are gated equally while both are maintained. The Expo job builds the
# RELEASE variant on purpose: `assembleDebug` skips the JS bundle task, and Metro
# resolution is exactly what breaks in this workspace (see the disableHierarchicalLookup
# entry in TROUBLESHOOTING.md). A debug APK would compile happily past that.
name: CI

on:
  # Every pull request, not just those targeting main — otherwise a stacked PR
  # (e.g. a spike branched off a feature branch) silently gets no gate at all.
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc + vue-tsc over both packages, then oxlint, oxfmt --check and vitest.
      # Includes the boundary guard that keeps the core free of platform SDKs.
      - name: Check
        run: npm run check

  expo-web:
    name: Expo web export
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web bundle
        working-directory: apps/mobile-rn
        run: npm run build:web

      # The export succeeding is NOT sufficient on its own: a component with no
      # web implementation still exports fine. react-native-webview in
      # particular renders "React Native WebView does not support this platform."
      # So assert the built output does not contain that text, and that the
      # routes we expect were actually emitted.
      - name: Assert the web bundle is not silently broken
        working-directory: apps/mobile-rn
        run: |
          set -euo pipefail
          if grep -rq "does not support this platform" dist/; then
            echo "::error::A component without web support reached the web bundle."
            grep -rl "does not support this platform" dist/ | head
            exit 1
          fi
          for route in index 404 artikel entdecken mediathek mitmachen profil; do
            test -f "dist/$route.html" || { echo "::error::missing dist/$route.html"; exit 1; }
          done
          echo "web export OK — $(find dist -name '*.html' | wc -l) routes, no unsupported-platform stubs"

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: correctiv-app-web
          path: apps/mobile-rn/dist
          if-no-files-found: error
          retention-days: 14

  android-expo:
    name: Android build (Expo)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" >/dev/null || true

      # Workspace root — installs every package and links @correctiv/app-core.
      - name: Install dependencies
        run: npm ci

      # android/ is gitignored: it is generated from app.json. --no-install because
      # npm ci already ran at the ROOT; letting prebuild install inside the app would
      # give it a private node_modules and break the workspace's hoisting.
      - name: Prebuild the native project
        working-directory: apps/mobile-rn
        run: npx expo prebuild --platform android --no-install

      # Autolinking gives a package's native module, but only its CONFIG PLUGIN edits
      # the native project — and a plugin has to be listed in app.json. expo-audio was
      # once missing from that list, so the manifest had no media service and
      # background playback could not work, with every check green. Read what prebuild
      # actually wrote rather than trusting that it ran.
      - name: Assert the generated manifest carries what the plugins promise
        working-directory: apps/mobile-rn
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for needle in \
            'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' \
            'expo.modules.audio.service.AudioControlsService' \
            'android:foregroundServiceType="mediaPlayback"'; do
            grep -q "$needle" "$MANIFEST" || {
              echo "::error::$needle missing from the generated manifest"
              cat "$MANIFEST"
              exit 1
            }
          done
          echo "manifest OK — media playback service and permission present"

      # Both apps must run on the same range of Android versions, so the floor has to
      # be the same number and not a coincidence of two frameworks' defaults. Expo's
      # comes from the SDK (via rootProject.ext), NativeScript's from a committed
      # file — ask Gradle for the resolved value rather than guessing at either.
      #
      # Only minSdk is compared. targetSdk deliberately differs: NativeScript is
      # pinned at 34 because 35+ forces edge-to-edge, which NS core 9.0.0 mishandles
      # (see App_Resources/Android/app.gradle), and dragging Expo down to 34 would
      # put it below Google Play's floor.
      - name: Assert both apps share a minSdk
        run: |
          set -euo pipefail
          EXPO=$(cd apps/mobile-rn/android && ./gradlew -q :app:properties \
            | sed -nE 's/^minSdkVersion: ([0-9]+)$/\1/p' | head -1)
          NS=$(sed -nE 's/^[[:space:]]*minSdkVersion ([0-9]+).*/\1/p' \
            apps/mobile/App_Resources/Android/app.gradle | head -1)
          echo "Expo minSdk=$EXPO   NativeScript minSdk=$NS"
          test -n "$EXPO" && test -n "$NS" || { echo "::error::could not read a minSdk"; exit 1; }
          [ "$EXPO" = "$NS" ] || {
            echo "::error::minSdk drifted apart — Expo $EXPO, NativeScript $NS. Both apps are shipped, so they have to support the same devices."
            exit 1
          }

      # arm64-v8a for a real demo device, x86_64 so the APK also installs on an
      # emulator. Skipping armeabi-v7a and x86 roughly halves the native build.
      - name: Build Android (release)
        working-directory: apps/mobile-rn/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: correctiv-app-expo-apk
          path: apps/mobile-rn/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  android-nativescript:
    name: Android build (NativeScript)
    runs-on: ubuntu-latest
    needs: check
    # Skip the NativeScript doctor preflight: a build-only runner has no
    # emulator/SDK images, which the doctor otherwise treats as a fatal error
    # even though a compilation-capable SDK is present.
    env:
      NS_SKIP_ENV_CHECK: "true"
      # @nativescript/vite 2.0.3 only deploys the Vite bundle into the native
      # project in watch mode (ns debug, via an IPC channel). A one-shot
      # `ns build` has no IPC, so the bundle never reaches assets/app and the
      # Static Binding Generator fails. Point Vite's output dir straight at the
      # platform assets dir so the bundle lands where the build expects it.
      NS_VITE_DIST_DIR: ${{ github.workspace }}/apps/mobile/platforms/android/app/src/main/assets/app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub-hosted ubuntu runners ship the Android SDK pre-installed; this
      # only makes sure licenses are accepted and SDK 35 is present.
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" >/dev/null || true

      # Workspace root — installs every package, links @correctiv/app-core.
      - name: Install dependencies
        run: npm ci

      - name: Install NativeScript CLI
        run: npm install -g nativescript

      - name: Build Android (debug)
        working-directory: apps/mobile
        run: ns build android

      # Surface the real Static Binding Generator error if the build fails:
      # the top-level log only says "error in the JS Parser execution".
      - name: SBG diagnostics on failure
        if: failure()
        working-directory: apps/mobile
        run: |
          echo "=== which node / version ==="; which node; node --version
          echo "=== runSbg.log ==="
          cat platforms/android/build-tools/runSbg.log 2>/dev/null || echo "(no runSbg.log found)"
          echo "=== js_parser verbose (enableErrorLogging) ==="
          node platforms/android/build-tools/jsparser/js_parser.js enableErrorLogging 2>&1 | tail -60 || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: correctiv-app-nativescript-apk
          path: apps/mobile/platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
