# Quality gate for every PR and every push to main.
#
# Three jobs, cheapest first:
#   check         — typecheck every package, oxlint, oxfmt --check, headless tests
#                   (~1 min incl. install; no Android SDK, no emulator)
#   web           — static web export of apps/mobile, plus assertions that it is
#                   not silently broken (see the job for why). Built for a domain
#                   root; pages.yml rebuilds the same export under the Pages base
#                   path and publishes it.
#   android       — Android APK of the app
#
# The repo is an npm workspace: `npm ci` runs at the root. Behaviour lives in
# packages/app-core, which is why `check` is worth running on its own before either
# build — see ARCHITECTURE.md and adr/0006-one-core-two-hosts.md.
#
# The Android job builds the RELEASE variant on purpose: `assembleDebug` skips the JS
# bundle task, and Metro resolution is exactly what breaks in this workspace (see the
# disableHierarchicalLookup entry in TROUBLESHOOTING.md). A debug APK would compile
# happily past that.
name: CI

on:
  # Every pull request, not just those targeting main — otherwise a stacked PR
  # (e.g. a spike branched off a feature branch) silently gets no gate at all.
  pull_request:
  push:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc over every workspace, then oxlint, oxfmt --check, jest and vitest.
      # Includes the boundary guard that keeps the core free of platform SDKs.
      - name: Check
        run: npm run check

  web:
    name: Expo web export
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web bundle
        working-directory: apps/mobile
        run: npm run build:web

      # The export succeeding is NOT sufficient on its own: a component with no
      # web implementation still exports fine. react-native-webview in
      # particular renders "React Native WebView does not support this platform."
      # So assert the built output does not contain that text, and that the
      # routes we expect were actually emitted.
      - name: Assert the web bundle is not silently broken
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          if grep -rq "does not support this platform" dist/; then
            echo "::error::A component without web support reached the web bundle."
            grep -rl "does not support this platform" dist/ | head
            exit 1
          fi
          for route in index 404 artikel entdecken mediathek mitmachen profil; do
            test -f "dist/$route.html" || { echo "::error::missing dist/$route.html"; exit 1; }
          done
          # One real id per dynamic family. A route that loses its
          # generateStaticParams exports as a single dist/<family>/[id].html and
          # every real URL under it 404s on a static host, while the build and
          # every test stay green. __tests__/web-target.test.ts keeps the export
          # on the route; this checks that the ids actually came out.
          for route in projekt/abriss-atlas aufruf/wem-gehoert-die-stadt serie/klima tagebuch/diary-bern-2 behauptung/claim-001; do
            test -f "dist/$route.html" || { echo "::error::missing dist/$route.html — a dynamic route did not pre-render its ids"; exit 1; }
          done
          echo "web export OK — $(find dist -name '*.html' | wc -l) routes, no unsupported-platform stubs"

      # The handbook is the other half of what Pages publishes, and it can break on
      # its own: it reads the repository's Markdown at build time, so a document
      # renamed or a link rewritten to a path that no longer exists fails here and
      # nowhere else. Its tests run in the `check` job; this is the build.
      - name: Build the handbook
        run: npm run build -w @correctiv/handbook

      - name: Assert the handbook is not silently empty
        run: |
          set -euo pipefail
          test -f apps/handbook/dist/404.html || {
            echo "::error::apps/handbook/dist/404.html is missing — every deep link would 404 on Pages."
            exit 1
          }
          # A handbook that shipped no documents still renders its navigation.
          grep -rq "platform-free" apps/handbook/dist/assets/*.js || {
            echo "::error::the handbook bundle carries none of the repository's documents."
            exit 1
          }
          echo "handbook OK"

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: correctiv-app-web
          path: apps/mobile/dist
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" >/dev/null || true

      # Workspace root — installs every package and links @correctiv/app-core.
      - name: Install dependencies
        run: npm ci

      # android/ is gitignored: it is generated from app.json. --no-install because
      # npm ci already ran at the ROOT; letting prebuild install inside the app would
      # give it a private node_modules and break the workspace's hoisting.
      - name: Prebuild the native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # Autolinking gives a package's native module, but only its CONFIG PLUGIN edits
      # the native project — and a plugin has to be listed in app.json. expo-audio was
      # once missing from that list, so the manifest had no media service and
      # background playback could not work, with every check green. Read what prebuild
      # actually wrote rather than trusting that it ran.
      - name: Assert the generated manifest carries what the plugins promise
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          for needle in \
            'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' \
            'expo.modules.audio.service.AudioControlsService' \
            'android:foregroundServiceType="mediaPlayback"'; do
            grep -q "$needle" "$MANIFEST" || {
              echo "::error::$needle missing from the generated manifest"
              cat "$MANIFEST"
              exit 1
            }
          done
          echo "manifest OK — media playback service and permission present"

      # arm64-v8a for a real demo device, x86_64 so the APK also installs on an
      # emulator. Skipping armeabi-v7a and x86 roughly halves the native build.
      - name: Build Android (release)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: correctiv-app-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
